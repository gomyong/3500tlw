<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar from {{DATA:COMPONENTS:COMPONENTS_8}} -->
<header class="bg-white dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-800 docked full-width top-0 z-50">
<div class="flex justify-between items-center w-full px-6 h-16 max-w-screen-xl mx-auto">
<button class="text-[#1F6F5F] dark:text-[#2a947f] hover:bg-neutral-50 dark:hover:bg-neutral-800 transition-colors p-2 rounded-full active:opacity-80 transition-opacity duration-150">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-[#1F6F5F] dark:text-[#2a947f] font-['Pretendard','Inter',sans-serif]">마지막 단어</h1>
<button class="text-[#1F6F5F] dark:text-[#2a947f] hover:bg-neutral-50 dark:hover:bg-neutral-800 transition-colors p-2 rounded-full active:opacity-80 transition-opacity duration-150">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-container-padding py-xl">
<!-- Progress Indicator -->
<div class="mb-xl text-center space-y-sm">
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">
                진행률
            </div>
<div class="font-headline-lg text-headline-lg text-[#1F6F5F]">
                12 / 20
            </div>
<!-- Progress Bar -->
<div class="w-48 h-1 bg-surface-container rounded-full overflow-hidden mx-auto">
<div class="h-full bg-primary-container w-[60%]"></div>
</div>
</div>
<!-- Testing Card -->
<div class="w-full max-w-md aspect-[4/3] bg-surface-container-lowest border border-stone-200 rounded-lg flex items-center justify-center text-center p-xl">
<div class="space-y-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">학습 단어</span>
<h2 class="font-display-word text-display-word text-[#333333] tracking-tighter">
                    ABANDON
                </h2>
</div>
</div>
<!-- Hint/Action -->
<div class="mt-lg">
<button class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="lightbulb">lightbulb</span>
                힌트 보기
            </button>
</div>
</main>
<!-- Fixed Interaction Bar -->
<footer class="sticky bottom-0 bg-background py-lg px-container-padding max-w-screen-xl mx-auto w-full pb-32">
<div class="grid grid-cols-2 gap-md w-full max-w-md mx-auto">
<!-- Forgot Button -->
<button class="flex items-center justify-center py-4 px-lg border border-stone-300 rounded-lg bg-[#EEEEEE] text-secondary font-headline-md text-headline-md hover:bg-stone-100 active:scale-95 transition-all">
                몰랐다
            </button>
<!-- Know Button -->
<button class="flex items-center justify-center py-4 px-lg bg-[#1F6F5F] text-on-primary font-headline-md text-headline-md rounded-lg active:scale-95 transition-all">
                알았다
            </button>
</div>
</footer>
<!-- BottomNavBar from {{DATA:COMPONENTS:COMPONENTS_8}} -->

<span class="material-symbols-outlined">auto_stories</span>
<span class="font-['Pretendard','Inter',sans-serif] text-[11px] font-medium">서재</span>
</button>
<button class="flex flex-col items-center justify-center text-neutral-400 dark:text-neutral-500 px-4 py-1.5 transition-all hover:text-[#1F6F5F] dark:hover:text-[#2a947f] active:scale-95 duration-200">
<span class="material-symbols-outlined">equalizer</span>
<span class="font-['Pretendard','Inter',sans-serif] text-[11px] font-medium">통계</span>

<span class="material-symbols-outlined">settings</span>
<span class="font-['Pretendard','Inter',sans-serif] text-[11px] font-medium">설정</span>
